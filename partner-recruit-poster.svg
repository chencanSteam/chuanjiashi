<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
  <title id="title">传家世合伙人招募</title>
  <desc id="desc">记录人生故事，传承家风记忆。传家世合伙人招募宣传长图。</desc>
  <rect width="1080" height="1920" fill="#f7f4ed"/>
  <rect width="1080" height="650" fill="#174f42"/>
  <path d="M0 610 C220 550 360 690 570 610 C760 540 900 590 1080 520 L1080 760 L0 760Z" fill="#205f50"/>
  <path d="M0 690 C220 630 390 790 640 690 C820 620 940 670 1080 620 L1080 820 L0 820Z" fill="#e9dfc9"/>

  <g transform="translate(74 76)">
