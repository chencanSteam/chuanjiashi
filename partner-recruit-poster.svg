      <circle cx="72" cy="75" r="38" fill="#e8f1ed"/>
      <path d="M54 88V64h36v24M62 64v-9h20v9M50 88h44" fill="none" stroke="#1f6855" stroke-width="4" stroke-linejoin="round"/>
      <text x="140" y="64" fill="#174f42" font-size="24" font-weight="700" font-family="serif">透明合作机制</text>
