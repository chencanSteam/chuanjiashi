      <circle cx="72" cy="75" r="38" fill="#e8f1ed"/>
      <path d="M58 76h28M72 62v28" stroke="#1f6855" stroke-width="5" stroke-linecap="round"/>
      <text x="140" y="64" fill="#174f42" font-size="24" font-weight="700" font-family="serif">区域合作支持</text>
