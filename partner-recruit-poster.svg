    </g>

    <g transform="translate(0 262)">
      <rect width="932" height="150" rx="8" fill="#fff" stroke="#e5ddcf"/>
      <circle cx="72" cy="75" r="38" fill="#fbf0d9"/>
      <path d="M53 80l19-22 19 22-19 15zM60 78h24" fill="none" stroke="#a87825" stroke-width="4" stroke-linejoin="round"/>
